<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d7377" />
      <stop offset="100%" stop-color="#4fd1c5" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4fd1c5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Ocean Rounded Backdrop -->
  <rect width="64" height="64" rx="16" fill="#071822" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#oceanGrad)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Mini Data Bars in Background -->
  <rect x="14" y="38" width="5" height="12" rx="2" fill="#0d7377" fill-opacity="0.5" />
  <rect x="23" y="32" width="5" height="18" rx="2" fill="#0d7377" fill-opacity="0.7" />
  <rect x="32" y="24" width="5" height="26" rx="2" fill="#4fd1c5" fill-opacity="0.4" />
  <rect x="41" y="16" width="5" height="34" rx="2" fill="#38bdf8" fill-opacity="0.3" />

  <!-- Bold Glowing "NN" Monogram -->
  <path d="M18 48V16L34 38V16" stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M34 48V26L48 48V16" stroke="url(#oceanGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Accent Analytics Spark Node -->
  <circle cx="48" cy="16" r="3.5" fill="#4fd1c5" />
</svg>